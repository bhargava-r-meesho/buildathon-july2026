name: Build Attempt Quality Guard APK

on:
  push:
    branches:
      - claude/hackathon-plugin-skills-2phzst
    paths:
      - "attempt-quality-guard/android/**"
      - ".github/workflows/build-attempt-quality-guard-apk.yml"
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attempt-quality-guard/android
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: attempt-quality-guard-debug-apk
          path: attempt-quality-guard/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
